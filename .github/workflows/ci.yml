name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentiment
          POSTGRES_PASSWORD: sentiment
          POSTGRES_DB: sentiment
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentiment"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://sentiment:sentiment@localhost:5432/sentiment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,postgres]"
      - name: Lint
        run: ruff check src app tests && ruff format --check src app tests
      - name: Tests
        run: pytest -q
      - name: Smoke benchmark on the synthetic corpus (no data needed)
        run: sentiment-benchmark benchmark --smoke
      - name: Upload smoke report
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ matrix.python-version }}
          path: |
            reports/smoke/results.md
            reports/smoke/results.csv
            models/smoke/*/model_card.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sentiment-ml-benchmark:ci .
      - name: Container health check
        run: |
          docker run -d --rm -p 5000:5000 --name smb sentiment-ml-benchmark:ci
          for i in $(seq 1 20); do curl -sf localhost:5000/health && break || sleep 2; done
          docker stop smb
