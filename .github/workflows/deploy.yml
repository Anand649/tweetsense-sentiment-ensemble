name: deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      model_bundle:
        description: "S3 prefix of the model bundle to bake (default: the tagged commit)"
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Pull model bundle from S3
        run: |
          PREFIX="${{ github.event.inputs.model_bundle || github.sha }}"
          aws s3 sync "s3://${{ secrets.ARTIFACTS_BUCKET }}/models/${PREFIX}/" models/ --exact-timestamps
          ls -R models | head -50

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Roll the ECS service
        run: |
          aws ecs update-service --cluster "${{ secrets.ECS_CLUSTER }}" --service "${{ secrets.ECS_SERVICE }}" --force-new-deployment
          aws ecs wait services-stable --cluster "${{ secrets.ECS_CLUSTER }}" --services "${{ secrets.ECS_SERVICE }}"

      - name: Smoke check
        run: |
          URL=$(aws elbv2 describe-load-balancers --query "LoadBalancers[?contains(LoadBalancerName, '${{ secrets.ECS_CLUSTER }}')].DNSName | [0]" --output text)
          for i in $(seq 1 20); do curl -sf "http://$URL/health" && break || sleep 6; done
