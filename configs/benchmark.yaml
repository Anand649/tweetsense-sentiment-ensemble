# Full benchmark: the two thesis datasets plus IMDB, four thesis feature sets
# plus raw sequences, five thesis models plus a soft-voting ensemble, a CNN and
# a BiLSTM.
#
#   sentiment-benchmark benchmark --config configs/benchmark.yaml
#
# Everything below is logged with each MLflow run, so a results table can
# always be traced back to the exact grid that produced it.

name: sentiment-benchmark
seed: 42
cv_folds: 5

tracking:
  enabled: true
  # uri: overrides MLFLOW_TRACKING_URI; default store is sqlite:///reports/mlflow.db

datasets:
  - name: twitter_hate            # thesis Ex1: racist/sexist tweet detection (binary, 7% positive)
    clean: {keep_hashtags: true, min_word_len: 3, remove_stopwords: true, stemmer: porter}
    split: {strategy: holdout, test_size: 0.2, seed: 42}
  - name: vaccination             # thesis Ex2: COVID-19 vaccine tweets, TextBlob weak labels (3 classes)
    clean: {keep_hashtags: false, min_word_len: 2, remove_stopwords: true, stemmer: porter}
    split: {strategy: holdout, test_size: 0.2, seed: 42}
  - name: imdb                    # extension: 50k movie reviews, official 25k/25k split
    enabled: false                # enable after `sentiment-benchmark data download --dataset imdb`
    clean: {keep_hashtags: false, min_word_len: 2, remove_stopwords: true, stemmer: porter}
    split: {strategy: official}

features:
  bow:      {type: bow,   max_df: 0.9, min_df: 2, max_features: 5000, ngram_range: [1, 2]}
  tfidf:    {type: tfidf, max_df: 0.9, min_df: 2, max_features: 5000, ngram_range: [1, 2], sublinear_tf: true}
  word2vec: {type: word2vec, vector_size: 200, window: 5, min_count: 2, sg: 1, negative: 10, epochs: 20}
  doc2vec:  {type: doc2vec,  vector_size: 200, window: 5, min_count: 5, negative: 7, epochs: 15}
  sequence: {type: sequence}

models:
  naive_bayes:         {type: naive_bayes, alpha: 0.5}
  logistic_regression: {type: logistic_regression, C: 1.0, class_weight: balanced}
  linear_svm:          {type: linear_svm, C: 0.5, class_weight: balanced}
  random_forest:       {type: random_forest, n_estimators: 400, class_weight: balanced_subsample}
  # general-purpose boosting settings; the thesis' staged grid-search values
  # (depth 8, min_child_weight 6, eta 0.1, subsample 0.9, colsample 0.5, gamma 1.2)
  # were tuned on Word2Vec features and under-fit sparse n-gram matrices
  xgboost:             {type: xgboost, n_estimators: 500, max_depth: 6, min_child_weight: 2,
                        learning_rate: 0.05, subsample: 0.9, colsample_bytree: 0.5, gamma: 0.0}
  ensemble:            {type: ensemble, names: [logistic_regression, linear_svm, xgboost],
                        members: {logistic_regression: {C: 1.0, class_weight: balanced},
                                  linear_svm: {C: 0.5, class_weight: balanced},
                                  xgboost: {n_estimators: 500, max_depth: 6, min_child_weight: 2,
                                            learning_rate: 0.05, subsample: 0.9, colsample_bytree: 0.5}}}
  cnn:                 {type: cnn,  embed_dim: 128, embedding_init: word2vec, kernel_sizes: [3, 4, 5],
                        n_filters: 128, dropout: 0.5, epochs: 8, patience: 2, batch_size: 64,
                        lr: 0.001, class_weight: balanced, max_len: 48}
  lstm:                {type: lstm, embed_dim: 128, embedding_init: word2vec, hidden: 128,
                        bidirectional: true, dropout: 0.5, epochs: 8, patience: 2, batch_size: 64,
                        lr: 0.001, class_weight: balanced, max_len: 48}

# model -> feature sets to evaluate it on (Naive Bayes is restricted to
# non-negative counts automatically)
grid:
  naive_bayes:         [bow, tfidf]
  logistic_regression: [bow, tfidf, word2vec, doc2vec]
  linear_svm:          [bow, tfidf, word2vec, doc2vec]
  random_forest:       [bow, tfidf, word2vec, doc2vec]
  xgboost:             [bow, tfidf, word2vec, doc2vec]
  ensemble:            [tfidf, word2vec]
  cnn:                 [sequence]
  lstm:                [sequence]
