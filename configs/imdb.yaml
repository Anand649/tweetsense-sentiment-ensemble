# IMDB extension: 50,000 movie reviews, official 25k/25k split. Reviews are
# roughly ten times longer than tweets, so this grid is sized for a CPU:
# 3-fold cross-validation, no Doc2Vec, shorter neural schedules. Results are
# merged into reports/results.csv next to the Twitter datasets.
#
#   sentiment-benchmark benchmark --config configs/imdb.yaml

name: sentiment-benchmark
seed: 42
cv_folds: 3

tracking:
  enabled: true

datasets:
  - name: imdb
    clean: {keep_hashtags: false, min_word_len: 2, remove_stopwords: true, stemmer: porter}
    split: {strategy: official}

features:
  bow:      {type: bow,   max_df: 0.9, min_df: 3, max_features: 20000, ngram_range: [1, 2]}
  tfidf:    {type: tfidf, max_df: 0.9, min_df: 3, max_features: 20000, ngram_range: [1, 2], sublinear_tf: true}
  word2vec: {type: word2vec, vector_size: 200, window: 5, min_count: 3, sg: 1, negative: 10, epochs: 8}
  sequence: {type: sequence}

models:
  naive_bayes:         {type: naive_bayes, alpha: 0.5}
  logistic_regression: {type: logistic_regression, C: 2.0}
  linear_svm:          {type: linear_svm, C: 0.5}
  random_forest:       {type: random_forest, n_estimators: 300}
  xgboost:             {type: xgboost, n_estimators: 400, max_depth: 6, min_child_weight: 2,
                        learning_rate: 0.1, subsample: 0.9, colsample_bytree: 0.5, gamma: 0.0}
  ensemble:            {type: ensemble, names: [logistic_regression, linear_svm, xgboost],
                        members: {logistic_regression: {C: 2.0}, linear_svm: {C: 0.5},
                                  xgboost: {n_estimators: 400, max_depth: 6, min_child_weight: 2,
                                            learning_rate: 0.1, subsample: 0.9, colsample_bytree: 0.5}}}
  cnn:                 {type: cnn,  embed_dim: 128, embedding_init: word2vec, kernel_sizes: [3, 4, 5],
                        n_filters: 128, dropout: 0.5, epochs: 4, patience: 1, batch_size: 64,
                        lr: 0.001, max_len: 200, max_vocab: 30000}
  lstm:                {type: lstm, embed_dim: 128, embedding_init: word2vec, hidden: 64,
                        bidirectional: true, dropout: 0.5, epochs: 3, patience: 1, batch_size: 64,
                        lr: 0.002, max_len: 160, max_vocab: 30000}

grid:
  naive_bayes:         [bow, tfidf]
  logistic_regression: [bow, tfidf, word2vec]
  linear_svm:          [tfidf]
  random_forest:       [tfidf]
  xgboost:             [tfidf, word2vec]
  ensemble:            [tfidf]
  cnn:                 [sequence]
  lstm:                [sequence]
