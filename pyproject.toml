[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-ml-benchmark"
version = "1.0.0"
description = "Reproducible benchmark of Naive Bayes, Logistic Regression, SVM, Random Forest, XGBoost, CNN and BiLSTM sentiment classifiers on Twitter and IMDB data, with MLflow tracking, a Flask API and drift monitoring"
authors = [{ name = "Rakibul Hasan Sium" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
keywords = ["sentiment-analysis", "nlp", "benchmark", "mlops", "xgboost", "lstm", "cnn", "mlflow"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<1.9",
  "scipy>=1.11,<1.18",
  "xgboost>=2.0,<3.4",
  "gensim>=4.3",
  "nltk>=3.8",
  "textblob>=0.18",
  "torch>=2.1",
  "mlflow>=2.10",
  "flask>=3.0",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "joblib>=1.3",
  "requests>=2.31",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]
postgres = ["psycopg2-binary>=2.9"]
collect = ["tweepy>=4.14"]
kaggle = ["kaggle>=1.6"]
twitter = ["transformers>=4.45,<5", "safetensors>=0.4"]

[project.scripts]
sentiment-benchmark = "sentiment_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "app"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 160
target-version = "py310"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]
